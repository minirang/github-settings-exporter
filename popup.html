<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Settings Exporter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="top">
            <h1>Settings Exporter</h1>
            <span id="statusPill" class="pill" data-tone="idle" role="status">대기</span>
        </header>

        <section class="target" aria-label="대상 Repository">
            <div class="field-label">Repository</div>
            <div id="repoName" class="repo">-</div>
            <div id="repoHint" class="hint"></div>
        </section>

        <section class="progress" aria-label="진행 상황">
            <div id="segments" class="segments" role="img" aria-label="Section별 진행 상태"></div>
            <div class="progress-line">
                <span id="progressText" class="mono">Progress: 0 / 0</span>
                <span id="currentText" class="muted"></span>
            </div>
            <ul id="legend" class="legend">
                <li><span class="dot" data-status="success"></span><span id="cntSuccess" class="mono">0</span> Success</li>
                <li><span class="dot" data-status="failed"></span><span id="cntFailed" class="mono">0</span> Failed</li>
                <li><span class="dot" data-status="timeout"></span><span id="cntTimeout" class="mono">0</span> Timeout</li>
                <li id="legendSkipped" hidden><span class="dot" data-status="skipped"></span><span id="cntSkipped" class="mono">0</span> Skipped</li>
                <li id="legendInterrupted" hidden><span class="dot" data-status="interrupted"></span><span id="cntInterrupted" class="mono">0</span> Interrupted</li>
            </ul>
        </section>

        <div id="notice" class="notice" data-kind="info" hidden></div>

        <section class="actions" aria-label="작업 제어">
            <button id="startBtn" class="btn primary" type="button">새로 시작</button>
            <button id="resumeBtn" class="btn" type="button">이어받기</button>
            <button id="stopBtn" class="btn" type="button">중지</button>
        </section>
        <section class="actions minor">
            <button id="focusBtn" class="btn link" type="button">Shadow Tab 열기</button>
            <button id="resetBtn" class="btn link danger" type="button">세션 초기화</button>
        </section>

        <details id="sectionsBox" class="sections">
            <summary>Section 상태</summary>
            <ol id="sectionList" class="section-list"></ol>
        </details>

        <section class="output" aria-label="추출 결과">
            <div class="output-head">
                <div class="view-switch" role="group" aria-label="미리보기 형식">
                    <button id="viewTxt" class="switch-btn" type="button" aria-pressed="true">TXT</button>
                    <button id="viewJson" class="switch-btn" type="button" aria-pressed="false">JSON</button>
                </div>
                <div class="copy-group">
                    <button id="copyTxt" class="btn small" type="button">TXT 복사</button>
                    <button id="copyJson" class="btn small" type="button">JSON 복사</button>
                </div>
            </div>
            <textarea id="preview" readonly spellcheck="false" aria-label="추출 결과 미리보기" placeholder="아직 추출된 결과가 없습니다."></textarea>
        </section>
    </main>
    <script src="popup.js"></script>
</body>
</html>
